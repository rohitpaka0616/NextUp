services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextup
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  localmod:
    build:
      context: .
      dockerfile: docker/localmod.Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Higher thresholds = fewer false positives (NextUp also gates on confidence in app)
      LOCALMOD_TOXICITY_THRESHOLD: "0.65"
      LOCALMOD_PROMPT_INJECTION_THRESHOLD: "0.85"
      LOCALMOD_SPAM_THRESHOLD: "0.85"
      LOCALMOD_NSFW_THRESHOLD: "0.55"
    volumes:
      - localmod_cache:/home/localmod/.cache
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/nextup"
      # NextAuth v5 / Auth.js: use AUTH_* (NEXTAUTH_* still works as alias)
      AUTH_SECRET: "change-me-in-production-use-openssl-rand-base64-32"
      AUTH_URL: "http://localhost:3000"
      ADMIN_EMAIL: "admin@example.com"
      LOCALMOD_URL: "http://localmod:8000"
    depends_on:
      db:
        condition: service_healthy
      localmod:
        condition: service_healthy

volumes:
  pgdata:
  localmod_cache:
